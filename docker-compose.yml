services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: masabul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-masabul}
      POSTGRES_USER: ${POSTGRES_USER:-masabul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-masabul_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - masabul_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  masabul_postgres_data:
